<html>

    <title>Information Form</title>

</head>
<body>

<i><h1 align="center" h1 style="color:lightgreen;"> SIGN IN TO GET STARTED</h1></i>

    <table border="50" align="center" id="td">

        <form>
   <tr>
  <td><label for="name">Name:</label></td>
   <td><input type="text" id="name"  placeholder="Enter your name"></td>
   </tr>

        
   <tr>
    <td><label for="E-mail">E-mail:</label></td>
  <td><input type="E-mail" id="Email" placeholder="Enter your E-mail"></td>
  </tr>

   <tr>
  <td><label for="password">Password:</label></td>
  <td><input type="password" id="password" placeholder="create your password"></td>
  </tr>
 <tr>
 <td>Gender:</td>
 <td>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
                
            </td>
        </tr>
        <tr>
  <td colspan="2" align="center">
       <input type="submit" value="Submit">
        <input type="reset" value="Reset">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
